<!DOCTYPE html>



<html>

<head>
    <title>Lämpötilat</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    

    <script type="importmap">
        {
          "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
          }
        } </script>

        <script src="api/api.js" defer></script>

    <style>

        .yearbutton {
            margin: 4px;
            border-radius: 5px;
            background-color: rgb(206, 228, 236);
            color: black;
            font-size: 20px;
        }
        .yearbutton:hover {
            background-color: rgb(82, 213, 252);
        }
        .yearbutton.selected:hover {
            background-color: rgb(182, 182, 242);
        }
        .showbutton {
            background-color: #0d6efd;
            color: #fff;
            border-radius: 5px;
            font-size: 20px;
            margin-left: 4px;
            margin-bottom: 20px;
        }
        .locationbutton {
            background-color: lightblue;
            margin-left: 10px;
            margin-bottom: 20px;
        }
        .locationbutton:hover {
            background-color: rgb(82, 213, 252);
        }
        .locationbutton.selected:hover {
            background-color: rgb(182, 182, 242);
        } 
        .groupbutton {
            margin: 4px;
            border-radius: 5px;
            background-color: lightblue;
            color: black;
            font-size: 20px;
        }
        .groupbutton:hover {
            background-color: rgb(82, 213, 252);
        }
        .groupbutton.selected:hover {
            background-color: rgb(182, 182, 242);
        } 

        .selected {
            background-color: rgb(127, 127, 247);
        }    
        button:disabled {
            background-color: grey;
        }    
        .margin5 {
            margin: 5px;
        }
        h2 {
            font-size: 8px;
        }

    </style>
</head>

    <body>
        <div class="container">
            <div id="app">

                <!-- <iframe src="excelhtmlkokeilu.htm" height="600" width="600" title="Iframe Example"></iframe> -->

                <div class="card">
                    <div class="page-title">
                    </div>
                    <div class="page-content col-md-6">
                        <h1 id="ID_PageTitle">Lämpötilatilastot</h1>
                        <h2>Ver 1.1</h2>
                        <hr>
                        <button class="locationbutton" @click="selectlocation(loc)" v-for="loc in locations.data" :class="{selected: location==loc}">{{ loc }}</button>
                        <p>Valitse näytettävät vuodet</p>
                        <button class="yearbutton" @click="selectyear(item)" :class="{selected:item.selected}" v-for="item in years">{{ item.year }}</button>
                        <hr>
                        <p>Valitse ryhmä</p>
                        <button class="groupbutton" @click="selectgroup(item)" :class="{selected: item.selected}" v-for="item in yeargroups">{{ item.first }}-{{ item.last }}</button>
                        <hr>
                        <button class="showbutton" @click="showstatistics" :disabled="!years.find(y => y.selected == true)">Näytä tilastot</button>
                        <div>{{ !years.find(y => y.selected == true) ? 'Valitse jokin vuosi' : ''}}</div>
                    </div>

                </div>
            </div>
        </div>
    </body>

    <script type="module">

        import { createApp, ref } from 'vue'
        

        (async function () {
            const userguid = new URLSearchParams(document.location.search).get("userid");
            let location = new URLSearchParams(document.location.search).get("location");
            if (location == "" || location == null || location == undefined) {
                location = "Salo";
            }
            else {
                const first = location.substring(0, 1);
                const rest = location.substring(1);
                location = first.toUpperCase() + rest.toLowerCase();
            }

            const vueapp = createvueapp(userguid, location);
        })();

            function createvueapp(userid, location) {
                return createApp({
                    data() {
                        return {
                            locations: [],
                            years: [],
                            yeargroups: [],
                            userid: userid,
                            location: location,
                        }
                    },
                    async mounted() {
                        this.locations = await apiGetLocations(userid);

                        await this.updateLocationInfo();
                    },
                    components: {
                    },
                    methods: {
                        async updateLocationInfo() {
                            const years = await apiGetYears(userid, this.location);
                            this.years = years.data.map(y => ({ selected: true, year: y }));
                            if (years.data && years.data.length > 1) {
                                let count = years.data.length;
                                let firstyear = years.data[0];
                                let lastyear = years.data[count - 1];
                                if (count > 10) {
                                    if (count < 20) {
                                        const half = Math.floor(count / 2);
                                        this.yeargroups.push({ first: firstyear, last: years.data[half], selected: true });
                                        this.yeargroups.push({ first: years.data[half + 1], last: lastyear, selected: true });
                                    }
                                    else {
                                        let index = 0;
                                        while (index < count) {
                                            this.yeargroups.push({ first: years.data[index], last: years.data[(index + 9) >= count - 1 ? count - 1 : index + 9], selected: true });
                                            index += 10;
                                        }
                                    }
                                }
                            }

                        },
                        selectyear(item) {
                            item.selected = !item.selected;
                        },
                        selectlocation(item) {
                            if (this.location != item) {
                                this.location = item;
                                this.updateLocationInfo();
                            }
                        },
                        showstatistics() {
                            const yearparams = this.years.map(y => y.selected ? y.year : null).filter(y => y !== null).join(',');
                            window.location.href = `./charts.html?${userid === null ? '' : 'userid=' + userid + '&'}years=${yearparams}&location=${this.location}`;
                        },
                        selectgroup(group) {
                            if (group.selected === true) {
                                setYearGroup(this.years, group, false);
                            }
                            else {
                                //this.yeargroups.forEach(g => {
                                    // if (g.selected === true) {
                                    //     setYearGroup(this.years, g, false);
                                    //     g.selected = false;
                                    // }
                                //});
                            }
                            group.selected = !group.selected;
                            if (group.selected) setYearGroup(this.years, group, true);

                            function setYearGroup(years, groupitem, state) {
                                years.forEach(y => {
                                    if (y.year >= groupitem.first && y.year <= groupitem.last) y.selected = state;
                                })
                            }
                        }
                    },
                }).mount('#app');
            }
    </script>

</html>
